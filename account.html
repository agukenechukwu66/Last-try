<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Details</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f4; }
        header { background: #333; color: #fff; padding: 10px 0; text-align: center; }
        .content { margin-top: 20px; background: #fff; padding: 20px; border-radius: 5px; }
        .info-group { margin-bottom: 15px; }
        .info-label { font-weight: bold; color: #555; }
        .info-value { color: #333; font-size: 1.1em; }
    </style>
</head>
<body>

<header>
    <h1>Account Details</h1>
</header>

<div class="content">
    <div class="info-group">
        <p class="info-label">Account Holder:</p>
        <p class="info-value">Demo User</p>
    </div>
    <div class="info-group">
        <p class="info-label">Account Number:</p>
        <p class="info-value">123456789</p>
    </div>
    <div class="info-group">
        <p class="info-label">Balance:</p>
        <p class="info-value">0.00 USDT</p>
    </div>
</div>

</body>
</html>
