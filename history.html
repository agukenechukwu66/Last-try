<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f4; }
        header { background: #333; color: #fff; padding: 10px 0; text-align: center; }
        .content { margin-top: 20px; background: #fff; padding: 20px; border-radius: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #f2f2f2; }
        .pending { color: #f0ad4e; font-weight: bold; }
        .confirmed { color: #5cb85c; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <h1>Transaction History</h1>
</header>

<div class="content">
    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Amount (USDT)</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>2026-09-13</td>
                <td>100.00</td>
                <td class="pending">Pending</td>
            </tr>
            <!-- More rows can be added here -->
        </tbody>
    </table>
</div>

</body>
</html>
