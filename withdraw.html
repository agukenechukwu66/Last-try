<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw Funds</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f4; }
        header { background: #333; color: #fff; padding: 10px 0; text-align: center; }
        .content { margin-top: 20px; background: #fff; padding: 20px; border-radius: 5px; text-align: center; }
        input[type="number"], input[type="text"] { width: 80%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #d9534f; color: #fff; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <h1>Withdraw Funds</h1>
</header>

<div class="content">
    <p>Enter the amount you wish to withdraw:</p>
    <input type="number" id="amount" placeholder="Amount in USDT">
    <br>
    <p>Enter your USDT withdrawal address:</p>
    <input type="text" id="address" placeholder="USDT TRC-20 Address">
    <br>
    <button onclick="confirmWithdraw()">Request Withdrawal</button>
</div>

<script>
    function confirmWithdraw() {
        const amount = document.getElementById('amount').value;
        const address = document.getElementById('address').value;
        if (amount > 0 && address.length > 10) {
            alert('Withdrawal request submitted for ' + amount + ' USDT.');
        } else {
            alert('Please enter a valid amount and address.');
        }
    }
</script>

</body>
</html>
