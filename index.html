<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Assets FX - Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 260px;
            background-color: #161b22;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #30363d;
        }

        .brand {
            font-size: 24px;
            font-weight: bold;
            color: #d29922; /* Gold accent */
            margin-bottom: 30px;
            padding-left: 10px;
        }

        .nav-links {
            list-style: none;
        }

        .nav-links li {
            margin-bottom: 15px;
        }

        .nav-links a {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            color: #8b949e;
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .nav-links a:hover, .nav-links a.active {
            background-color: #1f2430;
            color: #c9d1d9;
        }

        .nav-links a.active {
            border-left: 4px solid #d29922;
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
        }

        /* Main Content Styling */
        .main-content {
            flex: 1;
            padding: 30px;
            background-color: #0d1117;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .welcome-text {
            font-size: 24px;
            font-weight: 600;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background-color: #30363d;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #d29922;
        }

        /* Summary Cards */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background-color: #161b22;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #30363d;
        }

        .card-title {
            font-size: 14px;
            color: #8b949e;
            margin-bottom: 10px;
        }

        .card-value {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
        }

        /* Chart Section */
        .chart-section {
            background-color: #161b22;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #30363d;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8b949e;
        }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <div class="sidebar">
        <div class="brand">META ASSETS FX</div>
        <ul class="nav-links">
            <li><a href="#" class="active">Dashboard</a></li>
            <li><a href="deposit.html">Deposit</a></li>
            <li><a href="withdraw.html">Withdraw</a></li>
            <li><a href="#">Investment Plans</a></li>
            <li><a href="#">Transaction History</a></li>
            <li><a href="#">Profile</a></li>
            <li><a href="support.html">Support</a></li>
            <li><a href="#">Logout</a></li>
        </ul>
    </div>

    <!-- Main Dashboard Content -->
    <div class="main-content">
        <div class="header">
            <div class="welcome-text">Welcome Back, Bliz &#128080;</div>
            <div class="user-profile">
                <div class="avatar">B</div>
            </div>
        </div>

        <!-- Financial Summary Cards -->
        <div class="summary-grids">
            <div class="card">
                <div class="card-title">Wallet</div>
                <div class="card-value">$0.00</div>
            </div>
            <div class="card">
                <div class="card-title">Investment</div>
                <div class="card-value">$0.00</div>
            </div>
            <div class="card">
                <div class="card-title">Profit</div>
                <div class="card-value">$0.00</div>
            </div>
            <div class="card">
                <div class="card-title">Total</div>
                <div class="card-value">$0.00</div>
            </div>
        </div>

        <!-- Live Market Trading Chart Section -->
        <div class="chart-section">

</body>
</html>
